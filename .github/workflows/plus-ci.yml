name: Plus regression

on:
  push:
    branches: [plus/main]
    paths: [agent/**, internal/**, go.mod, go.sum, .github/workflows/plus-ci.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -race -tags=testing ./agent/... ./internal/entities/...
      - name: Cross-build Linux Agent
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/agent-amd64 ./internal/cmd/agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/agent-arm64 ./internal/cmd/agent
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bun test --preload ./tests/setup.ts ./tests
