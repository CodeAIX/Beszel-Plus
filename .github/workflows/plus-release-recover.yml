name: Plus verified release recovery
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Plus candidate run with passing tests and both images published
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate prior gates, checksums and existing immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.run_id }}
        run: python3 scripts/plus/recover.py
